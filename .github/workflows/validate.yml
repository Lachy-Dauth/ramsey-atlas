name: Validate catalogue
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check docs/app.js
      - run: node scripts/check-data.mjs
      - run: node scripts/derive-three-colour.mjs --check
